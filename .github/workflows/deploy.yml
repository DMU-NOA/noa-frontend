# 워크플로우 이름
name: Deploy to AWS S3 (frontend)

# ---------- 실행 조건 ----------
on:
  push:
    branches:
      - main          # main 브랜치에 push(머지 포함)될 때마다 자동 실행

# ---------- 권한 설정 ----------
permissions:
  id-token: write     # GitHub OIDC 토큰 발급 허용
  contents: read      # 레포 코드를 읽기만 가능

jobs:
  deploy:
    runs-on: ubuntu-latest      # GitHub가 제공하는 우분투 러너에서 실행
    steps:
      # 1. 레포 코드를 러너로 내려받기
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Node.js 20 설치 + npm 캐시 사용 (다음 실행부터 의존성 설치가 빨라짐)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. package.json 기준으로 의존성 설치
      # 락파일 기준으로 정확한 버전 설치 (node_modules 는 자동으로 지우고 새로 설치)
      - name: Install dependencies
        run: npm ci 

      # 4. 프론트엔드 빌드 -> ./dist 폴더에 정적 파일 생성
      - name: Verify Kakao Maps key
        env:
          VITE_KAKAO_APP_KEY: ${{ secrets.VITE_KAKAO_APP_KEY }}
        run: |
          if [ -z "$VITE_KAKAO_APP_KEY" ]; then
            echo "::error::Missing GitHub Actions secret VITE_KAKAO_APP_KEY. Set the Kakao JavaScript app key before deploying."
            exit 1
          fi

      - name: Build
        env:
          VITE_KAKAO_APP_KEY: ${{ secrets.VITE_KAKAO_APP_KEY }}
        run: npm run build

      # 5. OIDC로 AWS 자격 증명 획득
      #    - 액세스 키 대신 IAM Role을 임시로 위임받는 방식 (키 유출 위험 없음)
      #    - AWS_ROLE_ARN 은 GitHub Secrets 에 저장된 IAM Role
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      # 6. 빌드 결과물(./dist)을 S3 버킷에 동기화
      #    --delete : 이번 빌드(./dist)에 없는 파일은 S3 버킷에서도 삭제 (버킷을 항상 최신 빌드와 동일하게 유지)
      #    --exclude : .git, .github 폴더는 업로드 대상에서 제외
      - name: Deploy to S3
        run: |
          aws s3 sync ./dist s3://noa-frontend-bucket --delete \
            --exclude ".git/*" \
            --exclude ".github/*"

    # 7. CloudFront 캐시 무효화
    #    CloudFront 를 S3 앞에 두는 경우, 배포 후 캐시를 비워야 새 버전이 바로 반영됨, "/*" 는 모든 경로의 캐시를 삭제
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"